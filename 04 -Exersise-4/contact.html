<html lang="en">

<head>

</head>

<!-- Internal CSS -->
 <style>
    .contact-main{
        height: 80vh; 
        display: flex;
        justify-content: center;
        align-items: center;
    }
    form{
        max-width: 60rem;
    }
 </style>
<body>
    
    <!-- Procuxt: NAV - Carosel -Products-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Purr</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html
          ">Home</a>
                    </li>
                    <li class="nav-item">
                        <a target="_blank" class="nav-link" href="products.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    <li class="nav-item">
                        <a target="_blank" class="nav-link" href="contact.html">Contact</a>
                    </li>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Main -->
     <h1 class="text-center mt-4">Contact Us</h1>
     <main class="contact-main p-4 ">
        <form class="row g-3">
            <!-- First name -->
            <div class="col-md-6">
                <label class="form-label">First Name: </label>
                <input type="text" class="form-control">
            </div>
            <!-- Last name -->
            <div class="col-md-6">
                <label class="form-label">Last Name: </label>
                <input type="text" class="form-control">
            </div>
            <!-- Cellphone -->
            <div class="col-md-6">
                <label class="form-label">Cellphone: </label>
                <input type="tel" class="form-control">
            </div>
            <!-- Email -->
            <div class="col-md-6">
                <label class="form-label">Email: </label>
                <input type="email" class="form-control">
            </div>
            <!-- Messege -->
            <div class="col-md-12">
                <label class="form-label">Messege</label>
                <textarea class="form-control"></textarea>
            </div>
            <div class="col-md-12">
                <button class="btn btn-primary" type="submit">Submit</button>
            </div>
            <div class="col-md-12">
                <div class="alert alert-danger">Please make sure you fill in the form correct</div>
            </div>
        </form>
     </main>
     



    <!-- Footer -->
    <footer class="text-center text-lg-start bg-light text muted">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
        integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
        crossorigin="anonymous"></script>
</body>
